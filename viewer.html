<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>阅读器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px; height: 46px;
    background: #1b1b1f; color: #e6e6e6;
    font: 13px/1 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    border-bottom: 1px solid #333;
    user-select: none;
  }
  button {
    min-width: 34px; height: 32px; padding: 0 8px;
    border: 1px solid #3a3a40; border-radius: 7px;
    background: #26262c; color: #e6e6e6; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover { background: #32323a; }
  button:active { background: #2c2c34; }
  button:disabled { opacity: .35; cursor: default; }
  button svg { width: 16px; height: 16px; display: block; }
  #reload.spinning svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .addr {
    flex: 1; height: 32px; min-width: 80px;
    border: 1px solid #3a3a40; border-radius: 8px;
    background: #16161a; color: #d6d6d6;
    padding: 0 12px; font-size: 12px;
    display: flex; align-items: center; gap: 6px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .addr input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    color: #e6e6e6; font: 12px/1.4 -apple-system, system-ui, sans-serif;
  }
  .lock { opacity: .7; flex: 0 0 auto; }
  .spacer { flex: 1; }
  .title { font-weight: 600; opacity: .85; padding-left: 2px; }
</style>
</head>
<body>
  <button id="back" title="后退 (Alt+←)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button id="forward" title="前进 (Alt+→)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <button id="reload" title="重新加载 (Ctrl+Shift+R)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
  </button>
  <div class="addr">
    <span class="lock" title="安全连接">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#5fd06a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </span>
    <input id="url" type="text" placeholder="输入网址并回车前往" spellcheck="false">
  </div>
  <button id="open-external" title="在系统浏览器中打开">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
  </button>
  <button id="close" title="返回新闻列表 (Esc)" style="min-width:40px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
  </button>

<script>
  const back = document.getElementById("back")
  const forward = document.getElementById("forward")
  const reload = document.getElementById("reload")
  const urlInput = document.getElementById("url")
  const openExternal = document.getElementById("open-external")
  const closeBtn = document.getElementById("close")

  back.addEventListener("click", () => window.viewer.back())
  forward.addEventListener("click", () => window.viewer.forward())
  reload.addEventListener("click", () => window.viewer.reload())
  openExternal.addEventListener("click", () => window.viewer.openExternal())
  closeBtn.addEventListener("click", () => window.viewer.close())

  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const v = urlInput.value.trim()
      if (v) {
        const u = /^https?:\/\//i.test(v) ? v : "https://" + v
        window.viewer.navigate(u)
        urlInput.blur()
      }
    } else if (e.key === "Escape") {
      window.viewer.close()
    }
  })

  window.viewer.onUrl((u) => {
    if (document.activeElement !== urlInput) urlInput.value = u
  })
  window.viewer.onNavState((s) => {
    back.disabled = !s.canBack
    forward.disabled = !s.canForward
  })

  // 轮询主进程获取内容页状态（主路径，稳健不依赖事件投递）
  let pollTimer = null
  function pollState() {
    window.viewer.getState().then((s) => {
      if (!s) return
      if (document.activeElement !== urlInput) urlInput.value = s.url || ""
      back.disabled = !s.canBack
      forward.disabled = !s.canForward
      reload.classList.toggle("spinning", !!s.isLoading)
    }).catch(() => {})
  }
  pollTimer = setInterval(pollState, 500)
  pollState()

  // 初始地址占位
  urlInput.value = ""
</script>
</body>
</html>
