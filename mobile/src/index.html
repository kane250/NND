<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>NND</title>
  <link rel="icon" type="image/png" href="pwa-192x192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root, html.dark {
      --bg: #0f0f0f; --bg-card: #1a1a1e; --bg-card-hover: #22222a; --bg-input: #1e1e24;
      --text: #e6e6e6; --text-dim: #888; --text-muted: #555;
      --border: #333; --accent: #f14d42; --shadow: rgba(0,0,0,.4);
      color-scheme: dark;
    }
    html.light {
      --bg: #f7f7f8; --bg-card: #ffffff; --bg-card-hover: #f0f0f2; --bg-input: #ffffff;
      --text: #222; --text-dim: #777; --text-muted: #aaa;
      --border: #e2e2e6; --accent: #e0433a; --shadow: rgba(0,0,0,.08);
      color-scheme: light;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .app { max-width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
    .main { flex: 1; padding-bottom: 64px; }
    a { color: inherit; }

    /* ---------- Header ---------- */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; position: sticky; top: 0; z-index: 100;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding-top: calc(10px + env(safe-area-inset-top));
    }
    .logo { font-size: 17px; font-weight: 800; color: var(--accent); flex-shrink: 0; letter-spacing: .5px; }
    .header-title { font-size: 16px; font-weight: 600; }
    .category-chips {
      display: flex; gap: 6px; overflow-x: auto; flex: 1;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .category-chips::-webkit-scrollbar { display: none; }
    .chip {
      padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--bg-card); color: var(--text-dim); font-size: 13px;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .header-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      width: 32px; height: 32px; border: none; border-radius: 8px; font-size: 15px;
      background: transparent; color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { background: var(--bg-card-hover); }

    /* ---------- 卡片 ---------- */
    .columns { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--bg-card); border-radius: 12px; border-left: 3px solid var(--border);
      overflow: hidden; box-shadow: 0 1px 3px var(--shadow);
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
    }
    .card-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .card-name { font-size: 15px; font-weight: 600; }
    .card-subtitle {
      font-size: 11px; padding: 2px 6px; border-radius: 4px;
      background: var(--bg-card-hover); color: var(--text-dim); white-space: nowrap;
    }
    .card-actions { display: flex; align-items: center; gap: 2px; }
    .card-star {
      width: 30px; height: 30px; border: none; border-radius: 50%;
      background: transparent; color: var(--text-muted); font-size: 15px; cursor: pointer;
    }
    .card-star.starred { color: var(--accent); }
    .card-refresh {
      width: 28px; height: 28px; border: none; border-radius: 50%;
      background: transparent; color: var(--text-dim); font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .card-refresh.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card-body { padding: 8px 14px 12px; max-height: 400px; overflow-y: auto; }
    .loading, .error { padding: 20px; text-align: center; color: var(--text-dim); font-size: 13px; }
    .error { color: var(--accent); }
    .retry-btn {
      margin-left: 10px; padding: 3px 12px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg-card-hover); color: var(--text); font-size: 12px; cursor: pointer;
    }

    /* ---------- 新闻条目 ---------- */
    .news-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .news-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; position: relative; }
    .news-rank {
      min-width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; background: var(--bg-card-hover); color: var(--text-dim);
    }
    .news-link { flex: 1; text-decoration: none; color: var(--text); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .news-link:active { color: var(--accent); }
    .news-title { font-size: 14px; line-height: 1.4; }
    .news-info { font-size: 12px; color: var(--text-dim); }
    .item-more {
      width: 26px; height: 26px; border: none; border-radius: 50%; flex-shrink: 0;
      background: transparent; color: var(--text-muted); font-size: 15px; cursor: pointer;
    }
    .item-actions-mask { position: fixed; inset: 0; z-index: 200; }
    .item-actions {
      position: absolute; right: 0; top: 26px; z-index: 201;
      display: flex; gap: 8px; background: var(--bg-card-hover);
      border: 1px solid var(--border); border-radius: 10px; padding: 4px;
      box-shadow: 0 4px 16px var(--shadow);
    }
    .item-actions button {
      padding: 6px 12px; border: none; border-radius: 8px; font-size: 13px;
      background: transparent; color: var(--text); cursor: pointer;
    }
    .item-actions button:active { background: var(--bg-card); }

    /* ---------- 书签 / 历史 ---------- */
    .saves-page { padding: 12px; }
    .saves-tabs { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .saves-tab {
      padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--bg-card); color: var(--text-dim); font-size: 13px; cursor: pointer;
    }
    .saves-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .saves-clear {
      margin-left: auto; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg-card); color: var(--text-dim); font-size: 12px; cursor: pointer;
    }
    .saves-list { display: flex; flex-direction: column; gap: 8px; }
    .saves-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card); border-radius: 10px; padding: 10px 12px;
    }
    .saves-link { flex: 1; text-decoration: none; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .saves-title { font-size: 14px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .saves-meta { font-size: 11px; color: var(--text-dim); }
    .saves-remove {
      width: 28px; height: 28px; border: none; border-radius: 50%; flex-shrink: 0;
      background: transparent; color: var(--text-muted); font-size: 14px; cursor: pointer;
    }
    .empty-tip { padding: 40px 20px; text-align: center; color: var(--text-dim); font-size: 13px; line-height: 1.8; }
    .empty-tip.small { padding: 14px 6px; text-align: left; font-size: 12px; }

    /* ---------- 搜索 ---------- */
    .search-overlay {
      position: fixed; inset: 0; z-index: 300; background: var(--bg);
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top);
    }
    .search-bar {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg-input); color: var(--text); font-size: 14px; outline: none;
    }
    .search-go, .search-close {
      padding: 8px 12px; border: none; border-radius: 10px; font-size: 13px; cursor: pointer;
      background: var(--accent); color: #fff;
    }
    .search-close { background: var(--bg-card); color: var(--text-dim); }
    .search-results { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }

    /* ---------- 设置页 ---------- */
    .settings-page { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
    .settings-group {
      background: var(--bg-card); border-radius: 12px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .settings-group-title { font-size: 13px; font-weight: 600; color: var(--text-dim); }
    .settings-desc { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
    .segmented { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .seg-item {
      flex: 1; padding: 9px 0; border: none; font-size: 13px; cursor: pointer;
      background: transparent; color: var(--text-dim);
    }
    .seg-item.active { background: var(--accent); color: #fff; }
    .rss-add-row { display: flex; flex-direction: column; gap: 8px; }
    .form-input {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg-input); color: var(--text); font-size: 13px; outline: none;
    }
    .form-input:focus { border-color: var(--accent); }
    .primary-btn {
      padding: 10px 16px; border: none; border-radius: 10px;
      background: var(--accent); color: #fff; font-size: 14px; cursor: pointer;
    }
    .primary-btn:disabled { opacity: .5; }
    .normal-btn {
      flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg-card-hover); color: var(--text); font-size: 13px; cursor: pointer;
    }
    .rss-list { display: flex; flex-direction: column; gap: 6px; }
    .rss-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px; background: var(--bg-card-hover);
    }
    .rss-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .rss-name { font-size: 13px; }
    .rss-url { font-size: 11px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .opml-btn-row { display: flex; gap: 8px; }
    .opml-status {
      font-size: 12px; color: var(--text-dim); line-height: 1.6;
      padding: 8px 10px; border-radius: 8px; background: var(--bg-card-hover);
      white-space: pre-line; word-break: break-all;
    }
    .about-box { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .about-name { font-size: 15px; font-weight: 700; }
    .about-version { font-size: 12px; color: var(--accent); }
    .about-desc { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
    .about-links a { color: var(--accent); text-decoration: none; font-size: 13px; }

    /* ---------- 底部导航 ---------- */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 150;
      display: flex; background: var(--bg); border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar-item {
      flex: 1; padding: 7px 0 5px; border: none; background: transparent;
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      color: var(--text-muted); cursor: pointer;
    }
    .tabbar-item.active { color: var(--accent); }
    .tabbar-icon { font-size: 17px; line-height: 1; }
    .tabbar-name { font-size: 10px; }

    /* ---------- Toast ---------- */
    #nnd-toast {
      position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px);
      z-index: 400; padding: 9px 18px; border-radius: 999px;
      background: rgba(0,0,0,.78); color: #fff; font-size: 13px;
      opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
      max-width: 86vw; text-align: center;
    }
    html.light #nnd-toast { background: rgba(40,40,45,.9); }
    #nnd-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
